# Fly.io app config. The app name is set at deploy time with
# `flyctl deploy --app <name>` by the GitHub Actions workflow, so the
# placeholder below is never actually used — see
# .github/workflows/deploy-apartments-site.yml.
app = "rentfinder-placeholder"
primary_region = "ord"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
