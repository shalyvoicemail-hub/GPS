<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Listings</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">Rent<span>Finder</span></div>
      <nav class="nav-links">
        <a href="index.html">Browse</a>
        <a href="admin.html">Manage listings</a>
      </nav>
    </header>

    <div class="admin-wrap">
      <section class="panel" id="loginPanel">
        <div class="section-title" style="margin-top:0">Admin login</div>
        <form id="loginForm">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
          <div style="margin-top:12px">
            <button class="btn" type="submit">Log in</button>
          </div>
          <div class="msg error" id="loginMsg"></div>
        </form>
      </section>

      <section id="adminContent" hidden>
        <section class="panel">
          <div class="section-title" style="margin-top:0" id="formTitle">Add a new listing</div>
          <form id="listingForm" enctype="multipart/form-data">
            <input type="hidden" id="listingId" />
            <div class="form-grid">
              <div class="full">
                <label for="title">Title</label>
                <input id="title" name="title" placeholder="Sunny 2BR near downtown" />
              </div>
              <div class="full">
                <label for="address">Street address</label>
                <input id="address" name="address" />
              </div>
              <div>
                <label for="city">City</label>
                <input id="city" name="city" />
              </div>
              <div>
                <label for="state">State</label>
                <input id="state" name="state" />
              </div>
              <div>
                <label for="zip">ZIP</label>
                <input id="zip" name="zip" />
              </div>
              <div>
                <label for="price">Price / month ($)</label>
                <input id="price" name="price" type="number" min="0" />
              </div>
              <div>
                <label for="bedrooms">Bedrooms</label>
                <input id="bedrooms" name="bedrooms" type="number" min="0" />
              </div>
              <div>
                <label for="bathrooms">Bathrooms</label>
                <input id="bathrooms" name="bathrooms" type="number" min="0" step="0.5" />
              </div>
              <div>
                <label for="sqft">Square feet</label>
                <input id="sqft" name="sqft" type="number" min="0" />
              </div>
              <div class="full">
                <label for="description">Description</label>
                <textarea id="description" name="description"></textarea>
              </div>
              <div class="full">
                <label for="amenities">Amenities (comma-separated)</label>
                <input id="amenities" name="amenities" placeholder="In-unit laundry, Parking, Pool" />
              </div>
              <div>
                <label for="contactName">Contact name</label>
                <input id="contactName" name="contactName" />
              </div>
              <div>
                <label for="contactPhone">Contact phone</label>
                <input id="contactPhone" name="contactPhone" />
              </div>
              <div>
                <label for="contactEmail">Contact email</label>
                <input id="contactEmail" name="contactEmail" type="email" />
              </div>
              <div>
                <label for="available">Available?</label>
                <select id="available" name="available">
                  <option value="true">Yes</option>
                  <option value="false">No</option>
                </select>
              </div>
              <div class="full">
                <label for="images">Photos</label>
                <input id="images" name="images" type="file" accept="image/*" multiple />
                <div class="thumb-row" id="existingThumbs"></div>
              </div>
            </div>
            <div style="margin-top:16px; display:flex; gap:8px;">
              <button class="btn" type="submit" id="submitBtn">Add listing</button>
              <button class="btn btn-secondary" type="button" id="cancelEditBtn" hidden>Cancel edit</button>
            </div>
            <div class="msg" id="formMsg"></div>
          </form>
        </section>

        <section class="panel">
          <div class="section-title" style="margin-top:0">Your listings</div>
          <div id="adminListings"></div>
        </section>
      </section>
    </div>

    <script src="js/admin.js"></script>
  </body>
</html>
